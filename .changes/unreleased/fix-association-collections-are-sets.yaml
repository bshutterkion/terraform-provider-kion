kind: BUG FIXES
body: "Association collections are now sets rather than lists. The OpenAPI spec describes them as JSON arrays, so the generator produced ordered `schema.ListAttribute`, but the SDKv2 provider modelled every one as a `TypeSet` and the Kion API returns them in no meaningful order. The difference was invisible until a configuration was migrated: state held the collection in one order and configuration in another, equal as sets and unequal as lists, so `terraform plan` reported a change removing and re-adding every element at a different position. Measured against a live installation of 843 migrated resources, this was 96 of 98 attribute differences, and the plan went from 67 in-place updates to 2. Sorting on read cannot fix it \u2014 a provider cannot reorder a practitioner's configuration, so only set semantics compare correctly. Recognised by element type (a list of int64 is always an id collection in this API) as well as by an `_ids` suffix, which is what catches `aws_iam_policies`, `azure_role_definitions`, `gcp_iam_roles`, `owner_users` and `owner_user_groups`. String lists such as `regions` are left ordered."
time: 2026-08-24T18:00:00Z
