kind: BUG FIXES
body: "Association collections are now sets rather than lists. The OpenAPI spec describes them as JSON arrays, so the generator produced ordered `schema.ListAttribute`, but the SDKv2 provider modelled every one as a `TypeSet` and the Kion API returns them in no meaningful order. The difference was invisible until a configuration was migrated: state held the collection in one order and configuration in another, equal as sets and unequal as lists, so `terraform plan` reported a change removing and re-adding every element at a different position. Recognised by element type (a list of int64 is always an id collection in this API), by an `_ids` suffix, and by name for the string collections the API also returns unordered (`regions`, `supported_aws_regions`, `role_permissions`, `role_denials`, `notification_emails`, `scopes`). Measured against a live installation: a 843-resource migrated configuration went from 67 spurious in-place updates to a clean plan."
time: 2026-08-24T18:00:00Z
