kind: BUG FIXES
body: "`kion_project` could not be created on any budget-mode Kion install. It created through `POST /v3/project`, which the API rejects with `spend plans not available in budget mode` before it parses the body, so no payload could satisfy it and the five packages that need a project to exist -- `kion_project`, `kion_project_cloud_access_role`, `kion_project_enforcement`, `kion_project_permission_mapping`, `kion_custom_variable_override` -- were unusable with it. Create now dispatches on the install's financial mode: `POST /v3/project/with-budget` in budget mode, `POST /v3/project/with-spend-plan` otherwise. The mode is read from `GET /v3/app-config` when the provider configures, and a `budget` or `project_funding` value in the configuration overrides it, which is also the answer for a credential without the global settings permission needed to read app-config; with neither signal the provider says so instead of guessing. `budget` is now sent -- it was in the schema and in the model but no request carried it, consistent with targeting an endpoint that does not accept it. `POST /v3/project` is deprecated per the portal's own swagger comment and is no longer used."
time: 2026-09-11T21:30:00Z
