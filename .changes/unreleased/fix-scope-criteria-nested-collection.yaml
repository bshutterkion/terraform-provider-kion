kind: BUG FIXES
body: "`kion-import` no longer silently drops `kion_scope_criteria` (reported as `kion_scope_criteria empty 9 record(s) skipped: no id` against a real install). `/beta/scope` returns scope objects with their criteria nested inline as a `criteria_records` array, not a flat list of criteria records reachable by a second per-parent call the way `parent_list` resources are, so every record was misread as a scope and then skipped for lacking a `criteria_id`. A new `nested_collection` read shape reads the parent list once and extracts each parent's nested array directly, building each id as `<scope id>/<criteria id>` and falling back to the element's own `id` field when the declared child-id field isn't present in the payload, which live criteria records never carry. The manifest generator now records the shape's collection key, parent-id field, and child-id field on the manifest row instead of leaving the enumerator to re-derive them."
time: 2026-08-25T05:45:00Z
