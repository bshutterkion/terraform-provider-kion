kind: BUG FIXES
body: "`kion-import` no longer loses records to paginated collections that pad their pages. Some endpoints pad every page out to `total` rather than to the page size: `GET /v4/compliance/program/5/family?count=100` returns 110 items on page 1 (100 real plus 10 all-zero fillers) and 110 again on page 2 (10 real, 100 fillers). Counting the padding made page 1 look complete, so paging stopped and the 10 real records reachable only on page 2 were never fetched. They surfaced as `10 record(s) skipped: no id`, which reads like junk being discarded rather than real records going missing. Zero-valued records are now dropped before the page count is compared against `total`. Against a real installation `kion_compliance_family` goes from 587 records to the full 597, and `kion_compliance_control` reports its 6,006 without the 3,592 spurious skips."
time: 2026-08-25T18:45:00Z
