kind: BUG FIXES
body: "`kion-import` no longer loses records to paginated collections that pad their pages. Some endpoints pad every page out to `total` rather than to the page size: `GET /v4/compliance/program/5/family?count=100` returns 110 items on page 1 (100 real plus 10 all-zero fillers) and 110 again on page 2 (10 real, 100 fillers). Counting the padding made page 1 look complete, so paging stopped and the real records reachable only on later pages were never fetched. They surfaced as `record(s) skipped: no id`, which reads like junk being discarded rather than real records going missing. Zero-valued records are now dropped before the page count is compared against `total`. Against a real installation this recovers 3,602 records: `kion_compliance_control` goes from 2,414 to 6,006 and `kion_compliance_family` from 587 to the full 597."
time: 2026-08-25T18:45:00Z
