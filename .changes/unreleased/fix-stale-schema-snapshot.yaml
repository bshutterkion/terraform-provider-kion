kind: BUG FIXES
body: "The committed provider schema snapshot (`codegen/schema_snapshots/new.json`) is current again. It had not been refreshed since August and was missing five resources -- the four `kion_billing_source_*` variants and `kion_automation_policy` -- which matters because it is the ground truth for three completeness gates, and a resource absent from it passes them vacuously. Refreshing it surfaced four real problems that had been invisible: `cloud_rule_ids` and `key_id` were unclassified foreign keys (the first is a `kion_cloud_rule` reference, the second an AWS access key that must never be rewritten, like `portfolio_id`); `kion_project_note.create_user_id` was still listed as a read-only drop, so `kmigrate` would have stripped it out of a working configuration even though the new provider requires it, exactly as the old one did; and `kion_app_config` and `kion_project_enforcement` widen attributes from list to set with no `state_upgrades.yaml` entry, so customer state had no declared upgrade path. `automation_policy_ids` also moved from `not_references` to a real reference now that `kion_automation_policy` exists, so a cloud rule's attached policies rewrite into references rather than staying literal ids."
time: 2026-09-15T13:15:00Z
