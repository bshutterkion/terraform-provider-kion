kind: NOTES
body: "Acceptance-test configurations are now validated against the provider schema in CI. Acceptance tests only run against a live Kion instance, so nothing had ever checked that the HCL they feed Terraform matches the schema \u2014 and it did not: twelve configs used an `owner_users` block on resources whose schema declares an `owner_user_ids` list attribute, two set a read-only `id`, and the great majority were still the `kgen` scaffold's `# TIP: Fill in required attributes` placeholder with an empty resource body. All 87 configs are now filled in and validated by a new `acctest-config` job (locally, `make ci-acctest-config`), which builds the provider and runs `terraform validate` over each one \u2014 no Kion instance and no API call required."
time: 2026-08-24T12:00:00Z
