kind: BUG FIXES
body: "`kion_scope`, `kion_scope_criteria` and the `kion_custom_variable` data source had stopped regenerating and had drifted. The schema generator refuses a spec property carrying no type, and it drops the whole resource or data source rather than that one field, logging the skip and exiting successfully. The stale generated file stayed on disk, so nothing downstream noticed. As a result `kion_scope`'s data source still declared its association id collections as ordered lists, missing the set conversion every other type received, and `criteria` had degraded into an empty nested object. The `kion_custom_variable` data source schema had never been generated at all. `criteria` is raw JSON and is now typed as a string carrying `jsontypes.Normalized`; generation now fails loudly when a configured type is skipped."
time: 2026-08-25T02:01:00Z
