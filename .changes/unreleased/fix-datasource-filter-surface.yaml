kind: BUG FIXES
body: "Lifecycle and other server-owned fields are now filterable on list data sources. 33 fields across 16 resources reached neither the resource schema nor the `filter` surface, so a configuration could not match on them or read them out of `list`: `created_at` and `deleted_at` (`kion_account`, `kion_azure_account`, `kion_gcp_account`, `kion_custom_account`, `kion_user`, `kion_account_linkage`, `kion_app_api_key`), `last_login` and `display_name` on `kion_user`, `car_restricted` on `kion_azure_role` and `kion_gcp_iam_role`, `identifier` and `criteria_error` on `kion_scope`, and others. Two of these never rendered at all: `OptNilString` had no projection into a `list` object, which silently dropped every nullable timestamp the API returns. Credential fields stay unexposed, now by policy rather than by accident -- exposure is default-deny for any credential-shaped string, and `codegen/unexposed_fields.yaml` names the rest."
time: 2026-08-25T20:00:00Z
