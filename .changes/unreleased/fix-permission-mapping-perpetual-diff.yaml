kind: BUG FIXES
body: "The four permission-mapping resources (`kion_ou_permission_mapping`, `kion_project_permission_mapping`, `kion_funding_source_permission_mapping`, `kion_global_permission_mapping`) now converge instead of proposing the same write on every plan. Kion stores an empty member list and reports it back as JSON `null`, so `null` and `[]` are one state on the wire; the read mapped `null` to a null set, which never equalled the `user_ids = []` or `user_groups_ids = []` a configuration asked for, and each refresh re-proposed the change. The read now collapses both to an empty set, and `Create`/`Update` read the mapping back from the API before writing state, so a collection the configuration omits also lands on what Kion actually holds rather than on a guess left over from an unknown plan value. The read-back has a second effect: Kion answers 200 to a mapping for an app role the parent's permission scheme does not grant, then silently stores nothing, which used to leave a resource that planned as absent for ever; that now fails at apply with a diagnostic naming the cause. Two data-source acceptance tests that asserted an `id` their data source never sets were corrected: `kion_gcp_regions` has no `id` attribute at all, being the whole collection with nothing to select by, and `kion_account_linkage` read without an `id` or `filter` is in list mode, where `id` is the input rather than a result."
time: 2026-09-11T18:00:00Z
