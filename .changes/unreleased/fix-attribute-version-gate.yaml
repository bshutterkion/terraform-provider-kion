kind: BUG FIXES
body: "Setting an attribute the connected Kion is too old to accept now fails at plan, naming the attribute and both versions. Previously nothing checked it: gating worked at the level of whole operations, so a field added in 3.16 to a resource that exists in 3.13 had no gate at all. Portal decodes request bodies with `json.Unmarshal` and no `DisallowUnknownFields`, so the field was not rejected but dropped — the value never landed, and the practitioner saw \"Provider produced inconsistent result after apply\" or a diff that never converged, neither of which names the cause. `kgen versions` now walks the create body across every tracked SDK version and records the oldest Kion accepting each attribute, which finds `kion_billing_source.azure_connection`, `kion_cloud_rule.automation_policy_ids`, and `kion_project_enforcement.notification_emails` / `notification_frequency` — all 3.16-only fields on resources with no version gate of their own. Attributes no newer than the resource itself are omitted, since the resource gate already refuses those."
time: 2026-08-12T09:00:00Z
