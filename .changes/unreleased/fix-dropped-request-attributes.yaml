kind: BUG FIXES
body: "`kion_custom_variable` accepted `default_value_string`, `default_value_list` and `default_value_map` and sent none of them, so every apply failed with `unknown custom variable type encountered during value creation: <nil>`; `kion_permission_scheme` sent an empty update body, so every update failed with `Incorrect data structure`. Both are the same generator failure: a request field it could not map was skipped without a word, leaving a struct literal that compiles and lies. `make bind-check` now fails when a settable attribute is read by neither Create nor Update, reading the generated output so bespoke and hand-written bodies are held to the same rule; the attributes that already went unsent are recorded in `codegen/unbound_attributes.yaml` as a ratchet. Three shapes the generator previously dropped now map: a nested request object whose sub-fields are the model's top-level attributes, a request array that a declared `read_shape` explode describes in reverse, and a polymorphic `jx.Raw` field the schema splits into typed `_string`/`_list`/`_map` attributes -- which now also comes back apart on read, so the value survives refresh and import."
time: 2026-09-11T20:40:00Z
