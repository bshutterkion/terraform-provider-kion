kind: BUG FIXES
body: "`kion-import`'s manifest generator now also reads `codegen/private_endpoints.yaml`, which it previously never consulted, so three resources that were readable all along go from `unreadable` to correctly enumerable: `kion_aws_resource_tag` (flat list at `/v3/aws-resource-tag`, from the file's `list_read_only` section) and `kion_ou_cloud_access_role_exemption` / `kion_project_cloud_access_role_exemption` (parent-scoped under `/v3/ou` and `/v3/project`, child paths from the file's per-resource read entries). The lookup order is: a flat list-only path from `private_endpoints.yaml`, then the existing `generator_config.yaml` data-source path, then its resource read path, and only as a last resort a by-id read path from `private_endpoints.yaml` itself. Two more resources whose list endpoints appear in neither codegen file — verified live against a real install — are now enumerable by explicit override: `kion_dashboard` (`/v1/dashboards`) and `kion_funding_source_note` (parent-scoped under `/v3/funding-source`). Reading `/v1/dashboards` also required teaching the response unwrapper a fourth envelope shape: a named-collection object like `{\"data\":{\"dashboards\":[...],\"hidden_dashboard_count\":0}}` that wraps its list under a descriptive key -- alongside any number of sibling scalar/object metadata keys, which are ignored -- instead of `items` or a bare array."
