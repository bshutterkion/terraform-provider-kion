kind: BUG FIXES
body: "Published releases carry their notes again. Every release from v1.0.0 through v1.1.0 shipped with an empty body on GitHub, despite `release.yml` passing `--release-notes` the changie version file and verifying that file exists first. `.goreleaser.yml` also set `changelog: disable: true`, meaning \"we supply our own notes\" -- but `--release-notes` is read *by* the changelog pipe, so disabling it makes `Skip()` return true, `Run()` never execute, and the flag be discarded without a warning. The two settings read as reinforcing and in fact cancel. Removing `disable` restores the notes and does not reintroduce generated ones, because the flag already suppresses them: `Run()` loads the file, assigns it, and returns before the changelog is built. It also means a missing or unreadable notes file now fails the release rather than quietly publishing an empty one. The four affected releases had their notes backfilled from the version files already in the repository; their artifacts, checksums and signatures were not touched."
time: 2026-09-15T15:30:00Z
