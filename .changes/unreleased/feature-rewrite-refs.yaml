kind: FEATURES
body: "`kion-import rewrite-refs` turns the literal foreign keys in a generated configuration into references between resource blocks: `ou_id = 11` becomes `ou_id = kion_ou.kion_ou_11.id`. `terraform plan -generate-config-out` can only write literals, since Terraform has no way to know the value points at anything; the result is accurate for the install it came from but does not express its own dependency graph, so destroy-and-reapply does not order correctly and recreating a parent does not cascade — and against a different install the literal either dangles or silently binds to whatever record holds that id there. With references, Terraform resolves the value from the id it created, which is why moving a configuration between installs needs no id map. The id-to-label index comes from the import blocks, because the generated configuration contains no ids at all (they are Computed, so `-generate-config-out` omits them). Which attributes are foreign keys, and what each points at, is authored in the new `codegen/references.yaml`: the name is not enough to tell — `payer_id` is a billing source, `ugroup_ids` is a user group, and `portfolio_id` is an AWS id that must never be rewritten, sitting right beside `internal_portfolio_ids` which is a `kion_service_catalog`. A test fails when any new foreign-key-shaped attribute is left unclassified, so the table cannot silently rot as the provider grows (`make references-check`). Ids whose referent is not managed in the configuration are left as literals and reported by target type rather than silently kept — that boundary is closed by importing the referent too, or with a data source or a variable."
