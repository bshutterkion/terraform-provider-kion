kind: FEATURES
body: "`kgen import-modules` rewrites the configuration `terraform plan -generate-config-out` writes -- bare `resource \"kion_*\"` blocks -- into `module` calls against the modules under `modules/terraform-kion-*`, closing the gap between importing an install and managing it through the modules. The attribute-to-variable mapping comes from a new `modules/module_manifest.json`, written by `make modules`, rather than from `variables.tf`: `kgen module` renames any attribute colliding with a `module` block meta-argument, so `kion_cloud_rule`'s `source` becomes `cloud_rule_source` and `kion_compliance_program`'s `version` becomes `compliance_program_version`, and guessing those wrong does not fail cleanly -- Terraform reads a stray `source = \"aws\"` as the module's own source address. A resource block whose type has no manifest entry is left byte-for-byte alone, and an attribute with no module variable is dropped and reported rather than guessed at."
time: 2026-08-25T19:30:00Z
