kind: BUG FIXES
body: "Importing an existing installation now plans no changes. Verified against a production-scale install: 10,173 resources import and `terraform plan` reports 0 to add, 0 to change, 0 to destroy, where the same run previously reported 2,561 in-place updates and 385 errors. Four causes. Computed attributes carried no `UseStateForUnknown`, so every one planned as \"(known after apply)\" even though nothing had moved. JSON-valued attributes were compared byte-for-byte against the compact, key-sorted form `jsonencode` produces, so every policy, template and role definition reported a whitespace change; reads now emit the same canonical form, and a value that is not JSON, such as a YAML CloudFormation template, is left alone. Optional string attributes that the account endpoints return as \"\" were stored as empty rather than null, which the generated configuration writes as null. And 43 attributes were Required that the read never returns, which makes a resource unimportable by construction."
time: 2026-08-25T09:00:00Z
