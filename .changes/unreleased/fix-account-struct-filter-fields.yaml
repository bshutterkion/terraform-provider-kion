kind: BUG FIXES
body: "The remaining server-owned account fields are now filterable. `kion_azure_account`, `kion_gcp_account` and `kion_custom_account` gain `account_email`, `account_number` (`account_type_id` on custom), `car_external_id`, `include_linked_account_spend`, `linked_account_number`, `linked_role`, `service_external_id`, `use_org_account_info` and `skip_access_checking`, all `Computed`. These were withheld pending a per-cloud judgment that turned out not to apply: all five account resources read the same `/v3/account` endpoint, which returns one flat record shape with no separate per-cloud variant. Filtering on a field that is empty for a given account correctly matches nothing, whereas not exposing it meant no filter was possible at all. With this, every scalar the API returns is reachable from a configuration except `key_id` and `key_secret` on `kion_account_cache`, which are credentials and stay unexposed."
time: 2026-08-25T21:00:00Z
