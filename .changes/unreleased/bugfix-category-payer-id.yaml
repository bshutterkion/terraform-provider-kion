kind: BUG FIXES
body: "`kion_category` can now be created by its acceptance test. `POST /v3/category` requires `payer_id`, which the schema and the spec it came from both mark optional, so the generated config omitted it and every create failed with `Key: 'CategoryCreate.PayerID'`. A `payer_id` is install-specific, so it cannot be a literal in `codegen/test_values.yaml`: a new `env_args` key names environment variables whose values the generated config interpolates, as `%[2]s`, `%[3]s` and so on. Previously the only way to get an install-specific id into generated HCL was to hand-write the whole test, which `internal/kgen/tests/resource_meta.go` records as the reason two resources are hand-written today."
