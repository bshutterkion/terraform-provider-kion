kind: BUG FIXES
body: "Generated examples render a list- or set-nested attribute as `attr = [{ … }]` instead of `attr = { … }`. The old form is configuration Terraform refuses to load -- \"Inappropriate value for attribute: list of object required\" -- so the example for every resource carrying one was wrong: `kion_project`, `kion_cft`, `kion_aws_cloudformation_template`, `kion_idms_open_id`, `kion_ou_cloud_access_role`, `kion_permission_scheme` and `kion_project_cloud_access_role`. It went unnoticed because those attributes are all Optional, so the broken lines were emitted commented out; `kion_automation_policy` has a Required one, which renders live and made it visible. A map-nested attribute still renders as a bare object, because its keys are the practitioner's to choose and the schema cannot supply one. Separately, `kgen service` now indents the import it adds to `internal/provider/service_packages.go`; it wrote the line hard against the margin, so scaffolding a resource left the repository failing its own `gofmt` check."
time: 2026-09-15T13:10:00Z
