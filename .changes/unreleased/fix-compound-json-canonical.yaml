kind: BUG FIXES
body: "`kion_scope_criteria` no longer plans a change on every record. Its `criteria` attribute is a JSON string, and the compound CRUD path stored the API's response verbatim while `terraform plan -generate-config-out` writes the same value as `jsonencode({…})` -- compact, with sorted keys. The two differ only in whitespace, but semantic equality is not consulted when a generated configuration is planned, so every record reported an update that changed nothing. The value is now canonicalised through `flex.NormalizedToFramework`, which the entity path already used for exactly this reason. Against a real installation the plan goes from 9 changes to a completely clean one."
time: 2026-08-25T23:15:00Z
