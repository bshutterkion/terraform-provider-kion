kind: BUG FIXES
body: "Updating `kion_ou_cloud_access_role` failed with `decode response: unexpected status code: 200` on a write that had already succeeded, so Terraform marked the apply failed while the server held the change -- state and reality diverging, which is worse than a clean error. The spec declares `201` for the PATCH and the server answers `200`, so the ogen-generated decoder has no arm for the success it was given. Four operations are in that position: `PatchAppConfig`, `PatchAppRole`, `PatchOUCloudAccessRole` and `PatchProjectCloudAccessRole`, each annotated in the portal as `201: OKResponse` -- self-contradictory, since `OKResponse` is the 200 model. (`PatchBillingRule`, also flagged, is correct: it declares `204` and `NoContent` is what it returns.) The real fix is upstream -- correct the four annotations, regenerate the spec and the SDK, bump the pin -- and until it lands the generated Update bodies treat a 2xx the spec does not declare as the success it is, taking their state from the read-back that follows, which is authoritative either way. Nothing else is tolerated, and once the spec declares 200 the decoder returns a response instead of an error and `errs.IsUndeclaredSuccess` never fires again."
time: 2026-09-11T21:31:00Z
