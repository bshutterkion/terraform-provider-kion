kind: BUG FIXES
body: "Five resources accepted an attribute and then lost it on read, so import dropped it and a configured value diffed for ever. `kion_ou_enforcement` and `kion_funding_source_enforcement` dropped `cloud_rule_id` (and OU's `service_id`) because their record carries the cloud rule as a whole object while the model stores its id -- `kion_project_enforcement` unwrapped it only because the SDK happens to name the identical field `cloud_rule_id`. The flatten resolver now maps a payload object `foo` onto the model's scalar `foo_id`, the mirror of the existing `foos` -> `foo_ids` rule, which fixes all three uniformly and also recovers `kion_project_enforcement`'s `service_id` and the `ou_id`/`project_id` that `kion_ou_cloud_access_role` and `kion_project_cloud_access_role` were dropping. `kion_budget` lost `amount`: create expands it into one data row per month and the read returns only those rows, so the archetype now declares `sum_from` and the flatten adds them back up. `kion_funding_source` lost `owner_user_ids`, `owner_user_group_ids` and `permission_scheme_id`, none of which `GET /v3/funding-source/{id}` returns at all; its read now also reads the owner-role row of the funding source's permission mapping and the app policy behind the permissions tab, so an imported funding source finally produces a configuration that applies -- `POST /v3/funding-source` rejects a body with no permission scheme. Changing `owner_user_ids` or `permission_scheme_id` on an existing funding source now fails at apply rather than silently recording a value Kion does not have: the public PATCH carries neither (already recorded in `codegen/unbound_attributes.yaml`)."
time: 2026-09-11T22:15:00Z
