kind: BUG FIXES
body: "Acceptance tests now skip, rather than fail, when the target install cannot run them: `kion_azure_policy` and `kion_azure_arm_template` require a live Azure connection and gate on `KION_ACC_AZURE_PAYER_ID`, matching how a missing install-specific id already skips. A new `acctest.InstallCapabilities` reads the install's financial mode from `GET /v3/app-config` for the same purpose; a failure to read it is fatal rather than a skip, so an unreachable install cannot quietly turn tests green. The `kion_ou_note` tests were also repaired: they hardcoded `ou_id = 1` and changed `ou_id` and `create_user_id` on update instead of the note's own text, so they could only ever have passed on an install that happened to have an OU with that id, and their existence and destroy checks were TODO stubs that asserted nothing. They now create their own OU and verify through the API."
time: 2026-09-11T18:00:00Z
