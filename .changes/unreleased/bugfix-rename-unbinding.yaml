kind: BUG FIXES
body: "A renamed attribute is no longer silently unbound. `codegen/renames.yaml` gives an API field a different provider name, but the CRUD generator matched a request body field to a model attribute by the API's own name and never read that file -- so a renamed attribute stopped matching and the bind was skipped with no diagnostic, leaving the provider accepting the value and discarding it. `kion_project_enforcement.user_group_ids` was affected: setting it did nothing, and the value never reached the API. With the binder now consulting the rename map, all three enforcement resources also expose the list under the same name -- `kion_ou_enforcement` and `kion_funding_source_enforcement` previously surfaced the API's `ugroup_ids` spelling while `kion_project_enforcement` used `user_group_ids`, so one concept had two public names depending on which resource you were writing."
