kind: BUG FIXES
body: "The internal-reference gate now also scans the commit messages being pushed, and runs as a pre-push hook. It previously matched tracked file contents and paths only, which let backend source paths, internal environment names and production entity counts reach a public history in commit messages -- where the only remedy is rewriting published commits, so catching it before the push is the whole point. `make refresh-spec` is also fixed: a mangled shell line made it fail with a syntax error before doing anything, which is why nobody had noticed that its default spec path was wrong too."
