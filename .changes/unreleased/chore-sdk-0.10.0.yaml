kind: FEATURES
body: "The provider now tracks Kion 3.14-3.17, matching `kion-sdk-go` 0.10.0. That release adds `v3_17` and removes `v3_12` and `v3_13`, so the SDK ships exactly the supported window: the current release plus three back. Version gates are regenerated against it -- a resource present since 3.13 or 3.14 now spans the whole window and needs no gate at all, and a resource introduced in 3.17 gates at `>= 3.17` rather than going ungated. The tracked-version set is also declared once now instead of twice; the SDK had the same set spread across nine places and a missed one caused a two-week pipeline outage, so the duplicate was worth removing while here."
