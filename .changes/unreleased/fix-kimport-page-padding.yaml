kind: BUG FIXES
body: "`kion-import` now enumerates every compliance control and compliance family instead of only the first page of each. Kion's parent-scoped compliance collections (`/v4/compliance/program/{id}/control` and `.../family`) answer every page with an `items` array sized to the collection's `total`, populating only the requested page's window and filling the remainder with zero-valued placeholder records. The client saw a first page whose length already equalled `total`, concluded it had everything, and stopped paging — so on a demo install 3,592 of 6,006 controls and 10 of 597 families were reported as `record(s) skipped: no id` and never made it into an `import` block. The list reader now drops those all-zero padding records from a paginated response whose page overshoots the requested page size, and keeps paging until it has `total` real records. Well-behaved endpoints are untouched: the filter only inspects a page longer than the page size, and an endpoint that ignores `count` and returns every (real) record on page one still yields all of them in a single request. Verified against a live 3.16.3 install, where `kion_compliance_control` goes from 2,414 records with 3,592 skipped to 6,006 with none skipped, and `kion_compliance_family` from 587 with 10 skipped to 597 with none."
time: 2026-08-25T12:00:00Z
