kind: FEATURES
body: "Cross-field API constraints are now enforced at plan time instead of surfacing as an API error at apply. Twenty resources require at least one of a pair of attributes -- `owner_user_ids`/`owner_user_group_ids` on most, `user_ids`/`user_group_ids` on the enforcements, `role_permissions`/`role_denials` on `kion_gcp_iam_role` -- and neither is `Required` on its own, so the schema could not express it. Configuring neither produced `Bad Request: Key: 'UGroupCreate.OwnerUserIDs' Error:Field validation for 'OwnerUserIDs' failed on the 'atLeastOneFieldPresent' tag`, naming a Go struct field the user never wrote; it now produces `At least one of these attributes must be configured: [owner_user_group_ids,owner_user_ids]` before any request is made. The constraints are authored in `codegen/config_validators.yaml` rather than derived: the OpenAPI spec carries almost none (3 enums, 16 patterns and 5 maxLength across 474 schemas), so the source is the portal's own `validate:\"atLeastOneFieldPresent=...\"` struct tags. Attribute names are resolved per package, because the API body's spelling is not always the provider's. Two tests guard it -- one that declaration and generated code agree in both directions, one that every named attribute exists in the resource schema, since a validator naming a missing attribute is a runtime panic rather than a compile error."
time: 2026-09-11T21:00:00Z
