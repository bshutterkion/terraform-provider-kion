kind: BUG FIXES
body: "`make sweep` no longer reports success while cleaning nothing. Three defects stacked up: the target ran `go test -sweep=all ./internal/provider/...`, which put a package path after a flag `go test` does not recognize (so the path went to the test binary and the root package ran instead) and pointed at a package with no `resource.TestMain`, meaning no sweeper had ever run; 29 of 61 generated `sweep.go` files registered a sweeper whose body returned `nil`; and the hand-maintained import list that links sweepers into the run had drifted. The target now runs `./internal/sweep/... -sweep=all`, 36 resources have a real sweeper (five of them newly generated for parent-scoped collections such as `kion_ou_note`, declared as `sweep_parent` in `codegen/crud_archetypes.yaml`), and the 14 that cannot be enumerated or deleted through the API register nothing and say why in their `sweep.go` rather than reporting a clean sweep. `docs/TESTING.md` lists them. `TestSweeperRegistration` fails on a re-introduced no-op or a drifted import list."
time: 2026-08-25T19:30:00Z
