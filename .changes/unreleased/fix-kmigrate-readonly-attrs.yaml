kind: BUG FIXES
body: "`kmigrate` now drops attributes the new schema made read-only. `kion_project_note.create_user_id` was a required input on the old resource; the new one derives it from the authenticated caller and reports it back as computed, so configuration that still set it failed with \"Invalid Configuration for Read-Only Attribute\". This could not be expressed as an ordinary drop, whose guard asserts the attribute is absent from the new schema rather than present-but-computed, so it uses a sibling table with the opposite guard, checked both ways round by a test \u2014 any future settable-to-computed change now fails the build until it is covered."
time: 2026-08-24T00:00:00Z
