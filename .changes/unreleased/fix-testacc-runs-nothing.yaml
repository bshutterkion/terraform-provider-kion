kind: BUG FIXES
body: "`make testacc` ran zero acceptance tests. It targeted `./internal/provider/...`, which contains no `TestAcc` functions -- all 90 live in `./internal/service/...` -- so it exited 0 having run nothing, which is how the provider's 408 `Create`/`Update`/`Delete`/`ImportState` entry points reached 0% coverage without anybody seeing a failure. The target now runs the 71 service packages. Alongside it: `KION_APIPATH` lets the acceptance tests reach an installation that serves its API at the root rather than under `/api` (they write no provider block, so an environment variable was the only way to express it), `.github/workflows/acctest.yml` runs the suite on manual dispatch against a chosen GitHub Environment, and `scripts/discover-acc-env.py` reads the ten install-specific `KION_ACC_*` ids off a live install."
time: 2026-09-11T18:00:00Z
