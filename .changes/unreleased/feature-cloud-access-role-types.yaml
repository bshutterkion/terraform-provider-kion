kind: FEATURES
body: >-
  `kion_ou_cloud_access_role` and `kion_project_cloud_access_role` manage cloud
  access role types. Before this the public API created every role as a User
  role regardless, and the six fields that describe any other type were not
  exposed: `cloud_access_role_type_id` (1 User, 2 Custom Trust, 3 Account, 4
  Service), `aws_iam_role_trust_policy`, `aws_trusted_account_numbers`,
  `aws_trusted_services`, `aws_partition` and `aws_create_instance_profile`.
  Requires kion-sdk-go 0.11.0.

  Changing the role type forces replacement. The create body carries it and the
  update body does not, so an in-place change would be accepted and ignored,
  leaving the role as it was with the plan reporting success.

  Each non-User type requires the field naming who may assume the role, enforced
  at plan time rather than as a 400 at apply: type 2 needs the trust policy,
  type 3 the account numbers, type 4 the services. `cloud_access_role_type_id`
  is validated to 1-4 and `aws_partition` to the four real AWS partitions.

  The fields exist in Kion 3.15.13 and 3.16.5 and are absent from 3.17.0, which
  has not taken the backport. Setting one against a release that lacks it fails
  at plan naming both version ranges, because the API accepts unknown body
  fields, ignores them, and answers 200.
