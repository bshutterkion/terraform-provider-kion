kind: BUG FIXES
body: "`kion_funding_source_note` is manageable at all. Every apply created a note with id `0`: `POST /v2/funding-source-note` answers `{\"status\":201,\"data\":\"\"}` with no `record_id` anywhere in the body, the hand-rolled envelope decoded that silently as zero, and `Create` wrote `\"0\"` to state -- so refresh read id 0 and found nothing, destroy issued `DELETE /v2/funding-source-note/0`, and the real note stayed on the install forever. The note's id is now recovered by diffing its parent collection across the create, declared as `create_id` in `codegen/private_endpoints.yaml`. The fix is in the raw-HTTP create template rather than at the call site: any raw create that cannot produce a usable id now fails loudly (`errs.RawCreatedID`) instead of writing an unaddressable resource to state, which also closes the same unguarded path in `kion_dashboard`. `errs.CreatedID` rejects an explicit `record_id: 0` on the SDK path for the same reason."
time: 2026-09-11T21:40:00Z
