kind: BUG FIXES
body: "`kion_project_note` and `kion_dashboard` could not be imported at all: their private reads render several columns through Go's SQL null wrappers, so the whole response failed to decode against a wire struct declaring plain scalars. Verified against a live install, `/v2/project-note` returns `last_update_user_id` as `{\"Int\":0,\"Valid\":false}` and `updated_at` as `{\"Time\":\"…\",\"Valid\":false}`, and `/v1/dashboard` returns `description` and `updated_at` the same way and `config` as the JSON object itself rather than a string of JSON. A new `read_kinds` map in `private_endpoints.yaml` retypes individual attributes to tolerant wire types that accept either rendering and encode back to the bare scalar, so making the read tolerant does not change what a write sends. A never-updated record now reads as null instead of the year-1 zero instant, and `config` is canonicalised to the byte form `jsonencode` emits."
time: 2026-08-25T09:41:00Z
