kind: BUG FIXES
body: "`labels` on `kion_ou` and `kion_cloud_rule` are now actually applied. Kion carries labels on a per-resource sub-resource (`GET`/`PUT /v3/<type>/{id}/labels`) and never in the resource's own request body, so the attribute was accepted and silently discarded on every apply. Create and Update now write them, and Read loads them, so a label changed outside Terraform is detected. Labels must already exist as `kion_label` resources: Kion answers `422 app label does not exist` for an unregistered key, and that status is a response variant rather than a Go error, so it was previously invisible -- the generated code now surfaces it instead of reporting success and dropping every label."
