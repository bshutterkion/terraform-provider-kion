kind: BUG FIXES
body: "Changing `aws_iam_policies`, `azure_role_definitions` or `gcp_iam_roles` on an existing `kion_ou_cloud_access_role` or `kion_project_cloud_access_role` now takes effect. All three are bound at create, but the update synced only the user and user-group lists, so a policy change was accepted, discarded server-side, and put back by the next refresh -- a plan that never converged. The associations endpoint carries all six lists; only three were declared in `codegen/memberships.yaml`. A new acceptance test swaps one attached policy for another and asserts the attribute afterwards, which fails against the previous behaviour with \"Provider produced inconsistent result after apply\"."
