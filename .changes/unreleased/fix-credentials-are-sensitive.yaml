kind: BUG FIXES
body: "Credential attributes are now marked sensitive, so Terraform redacts them from plan and apply output. The OpenAPI spec has no way to say \"this is a credential\" and nothing else supplied it, so every generated schema published its secrets in cleartext: `smtp_password` on `kion_app_config`, `key_secret` on `kion_billing_source_aws`, `private_key` on `kion_billing_source_oci`, `oauth_client_secret` on `kion_gcp_service_account`, and `tenant_client_secret` inside `kion_billing_source`'s `azure_connection`, along with the matching data sources. The previous SDKv2 provider did not mark them either, so these values were never protected. They now render as `(sensitive value)`."
time: 2026-08-25T02:00:00Z
