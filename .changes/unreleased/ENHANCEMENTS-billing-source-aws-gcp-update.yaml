kind: ENHANCEMENTS
body: >-
  `kion_billing_source_aws` and `kion_billing_source_gcp` can now be updated in
  place. Before, any change failed with "Not supported". The update sends the
  current record back with the planned values applied, so settings Terraform
  does not manage are kept. Changing `account_type_id` (both) or the deprecated
  `only_dbr` (AWS) now forces replacement, because the update cannot change
  them. `key_id` is now marked sensitive.


  `kion_billing_source_aws` now rejects `key_id` without `key_secret` (or the
  reverse) at plan time. The API uses an access key pair only when both halves
  are set, so setting one alone was accepted and then ignored.


  `kion_billing_source_gcp` now reads `billing_start_date` back correctly, and
  its create now sends `big_query_export`. Before this fix, every refresh failed
  and the BigQuery export settings were dropped on create.
time: 2026-10-01T02:14:14Z
