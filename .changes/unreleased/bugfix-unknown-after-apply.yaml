kind: BUG FIXES
body: "Every `Create` and `Update` now resolves still-unknown attributes to null before writing state, fixing `Provider returned invalid result object after apply` on 8 resources (`kion_cloud_rule`, `kion_compliance_standard`, `kion_compliance_check`, `kion_iam_policy` and others). An `Optional`+`Computed` attribute is unknown at plan time when the configuration omits it, and the read-back after create assigns only what the API returns -- so a write-only input like `cloud_rule_id`, or any field the API never echoes back (`last_updated`, the `kion_cloud_rule` attachment lists), reached state still unknown and Terraform rejected the apply outright. Null is the honest answer, since the API does not hold the value, and `UseStateForUnknown` then keeps it stable across later plans. Separately, the expansion of a nested object list no longer calls `ElementsAs` on a null or unknown collection, which failed with `Received unknown value, however the target type cannot handle unknown values` on `kion_cft` and `kion_permission_scheme`; it is now guarded the same way the `flex` slice helpers already were. Neither defect was reachable by `build`, `vet`, `lint` or the unit tests -- nothing below an actual apply inspects a post-apply value -- and both were found by the provider's first acceptance-test run."
time: 2026-09-11T12:00:00Z
