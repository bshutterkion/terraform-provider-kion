kind: BUG FIXES
body: "`kmigrate` now rewrites ownership blocks written as `dynamic` blocks. Every ownership block in the coverage surface is written as `dynamic`, which is how a configuration generates a repeatable block from a variable, and the rewriter recognised only literal blocks \u2014 so all 22 `owner_users` / `owner_user_groups` / `owner_groups` findings survived migration untouched. An attribute has no dynamic form, so the construct collapses into a `for` expression over the same `for_each`, with the block's iterator resolved to the loop variable (the two-variable form only when the body reads `.key`); a resource mixing literal and dynamic blocks of the same name gets a `concat`. Every generated expression is round-tripped through the HCL parser, so a rewrite that would not parse is reported rather than written, and a malformed dynamic block comes back as a follow-up instead of a panic. The same support covers the object-bodied blocks (`project_funding`, `budget`, `move_ou_settings`)."
time: 2026-08-24T00:00:00Z
