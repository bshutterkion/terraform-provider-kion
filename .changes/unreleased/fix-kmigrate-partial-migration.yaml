kind: BUG FIXES
body: "`kmigrate` no longer leaves a configuration half-migrated. It exited on the first file it could not parse, having already rewritten every file before it \u2014 so one unparseable file (Terraform rejects them too) left a tree that was part old-provider syntax and part new, with no record of which was which. Unparseable files are now skipped untouched, listed at the end, and reported with a non-zero exit; everything else migrates. Re-running after fixing them is safe, because the rewrites are idempotent. Found by running it over a real configuration of 850 files, where one bad file stopped the migration after 125 of them."
time: 2026-08-24T16:00:00Z
