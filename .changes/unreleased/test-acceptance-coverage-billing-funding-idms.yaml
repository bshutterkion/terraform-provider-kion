kind: BUG FIXES
body: "17 service packages gained their first acceptance test, and running them against a live 3.16 install found four defects that compiled, linted and passed their schema unit tests: `kion_funding_source` drops `owner_user_ids` and `permission_scheme_id` on read so it cannot be imported (#68); `kion_budget` loses `amount`, which create expands into per-month `data` rows that `flattenBudget` ignores (#69); `kion_ou_enforcement` and `kion_funding_source_enforcement` drop `cloud_rule_id` (and `service_id`) because the record carries them as nested objects that `flatten` never unwraps, where `kion_project_enforcement` of the same archetype does unwrap them (#70); and every `kion_funding_source_note` is created with id 0, because `POST /v2/funding-source-note` returns no `record_id` and `Create` treats the missing id as success (#71). Those tests are left red on purpose, each naming its issue in a header comment. The generator behind them (`internal/kgen/tests`) was itself the reason these packages had none: it emitted `generated/v3_15` imports while the provider is on `v3_16`, so every file it wrote with an SDK get method failed to compile; it filled a Required attribute that was also a dependency's target field from the generic `1` fallback instead of referencing the dependency it had just created (`kion_compliance_family` posted a program id of 1 and got a 404); it asserted every computed data-source attribute was set, including optional ones the config never sets; and its registry carried the old SDKv2 provider's `owner_users { id = 1 }` block syntax, which no generated schema declares. It now also supports `RequiredEnv` (a resource whose create needs a record this install cannot invent SKIPs naming the variable, rather than failing), `ImportIDParentField` (the `parent_list` archetype's `\"<parent>/<id>\"` import id), `NoUpdate`, and `KnownIssues`."
