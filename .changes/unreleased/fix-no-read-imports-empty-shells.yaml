kind: BUG FIXES
body: "`kion_ou_cloud_access_role_exemption`, `kion_project_cloud_access_role_exemption` and `kion_aws_resource_tag` imported as empty resources: the `no_read` archetype's `Read` is a no-op and `ImportState` sets only the id, so `terraform plan -generate-config-out` wrote a body with no attributes at all, and the plan reported no changes because every attribute is Optional+Computed and null. `no_read` means the public spec has no by-id GET, not that the record is unreadable, so all three now declare a `parent_read` and get a real read. Two properties of the exemption collections are handled with it, both measured against a live install: they are inherited rather than owned, so one record is returned under every OU in its subtree (329 rows for 22 records) and the owner is taken from the record's own key rather than the path; and they mix cloud rule exemptions in with cloud access role exemptions, so a declared discriminator keeps records of the neighboring kind out (only 6 of 22 were this resource, and 0 of 12 on the project side). Their import ids are now `\"<parent_id>/<id>\"`."
time: 2026-08-25T10:15:00Z
