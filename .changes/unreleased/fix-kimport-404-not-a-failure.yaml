kind: BUG FIXES
body: "`kion-import` no longer reports a parent-scoped resource as failed just because some parents legitimately have none of it. A per-parent child-collection read that comes back 404 is an expected — “this parent has none” — answer, but it was being treated the same as a real server error, so a resource where every parent was empty (or a mix of empty and populated) could show `error` in the plan even though nothing was actually wrong. The client now returns a typed `StatusError` carrying the HTTP status, and the parent-scoped and multi-parent-scoped readers use it to count 404s as absences rather than failures: any records still make the result `ok`, no records with a real failure (e.g. a 502) is still `error`, and no records with only absences is `empty`, naming how many parents had none. When there are both records and 404s the absence is not mentioned at all — only failures worth investigating are called out, so the caveats block stays meaningful instead of noise. Verified with parent-scoped and multi-parent-scoped test cases covering all-404, mixed 404-and-records, a 502 among 404s, and 404-plus-502-plus-records."
time: 2026-08-25T03:39:34Z
