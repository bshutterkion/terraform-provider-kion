kind: BUG FIXES
body: "`kion_compliance_control` can now be imported. `program_id` is not in the read payload and cannot be recovered afterwards, yet delete addresses the control through it -- so an imported control was left with `program_id` unset and its delete issued `DELETE .../program/0/control/{id}`. Its import id is now `\"<program_id>/<id>\"`, and `codegen/import_manifest.json` records the same format so `kion-import` emits ids the resource can actually parse. An entity archetype that declares `delete_extra_field` gets this automatically, since that knob already marks a record addressed through a parent the read does not return."
