kind: BUG FIXES
body: "A create whose response carries an explicit id of `0` now fails instead of recording it. The envelope id path checked that the field was present but not that the value was usable, so an API returning `0` produced a resource whose state id was `\"0\"` -- a record that exists on the install and that Terraform can never read, update or delete. This is the SDK-side half of the same defect fixed for the raw-HTTP path, and it now routes through the same `errs.RawCreatedID` guard. Five resources use the envelope path: `kion_app_api_key`, `kion_compliance_control`, `kion_project_line_item`, `kion_scope` and `kion_user`."
