kind: BUG FIXES
body: "Resources that could not be imported now can. Importing a real installation surfaced 385 failures across 9,807 resources, in four classes. Five attributes were Required but never returned by the read (`kion_funding_source.permission_scheme_id`, `kion_project.permission_scheme_id`, `kion_gcp_account.google_cloud_project_id`, `kion_azure_account.subscription_uuid`, `kion_gcp_iam_role.role_permissions`); a Required attribute the read cannot supply makes import impossible, because `terraform plan -generate-config-out` writes configuration from the read and validation then rejects what the provider itself produced. The three enforcement resources set only `id` on import while their read looks the record up under its parent, so every import 404'd; they now take `<parent>_id/id`. `billing_start_date` was read from the private endpoint as the number 202406 and formatted as \"202406\", which the schema's own YYYY-MM validator rejected, so no billing source could round-trip. And a collection the API returns with a repeated id failed set validation outright."
time: 2026-08-25T06:00:00Z
