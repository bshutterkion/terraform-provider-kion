kind: BUG FIXES
body: "`kion_custom_variable_override` could not be imported at all. `kion-import` refused it because its read path carries two placeholders (`/v3/account/{account_id}/custom-variable/{custom_variable_id}`) and neither id can be discovered from the other; separately, its `ImportState` parsed the id as a bare integer and set only `id`, leaving `entity_type`, `entity_id` and `custom_variable_id` -- the three fields `Read` dispatches on -- unset, so an import would have failed even had one been generated. The compound path turns out to have a plural sibling that needs only one id: `/v3/{account,ou,project}/{id}/custom-variable` lists every variable at that entity with a non-null `override` on exactly the ones set there. The resource is now enumerated across all three parent kinds -- it is polymorphic, and on a demo install an account-only read would have found 5 of the 21 overrides that exist -- at one request per entity (151) rather than one per entity/variable pair (1,812). `ImportState` now splits the three-part `\"<entity_type>/<entity_id>/<custom_variable_id>\"` id that `Create` has always built, and validates both ids. Verified end to end against a live install: 21 imported, 0 changed, and a second plan reports no changes."
time: 2026-08-25T14:30:00Z
