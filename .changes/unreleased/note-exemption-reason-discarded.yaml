kind: NOTES
body: "`reason` on `kion_ou_cloud_access_role_exemption` and `kion_project_cloud_access_role_exemption` is accepted by the API and never stored: there is no `reason` column on the exemption table, no such field on the backend entity, and the `/v3` controller that handles the create never reads it off the request, though the request model declares it with a swagger example. Setting it in a configuration is therefore silently a no-op, and an imported exemption has `reason = null` because no exemption has ever had one. Documented in `docs/IMPORTING.md` under \"Attributes the API accepts and discards\". This corrects an earlier note that described it as a value that was set but could not be read back — it sent operators to re-enter something that does not persist."
time: 2026-08-25T14:20:00Z
