kind: FEATURES
body: >-
  Acceptance tests are generated. Two resources had a test_values entry, so
  kgen produced 4 of the 111 acceptance-test files and the rest were
  hand-maintained -- stale output the generator could no longer reproduce,
  which is how five of them still carried TODO stubs from a template revision
  that had since grown real Exists/Destroy checks.

  The input model was the blocker rather than the data. test_values.yaml
  described a flat attribute map for one resource block, and most tests need a
  parent first. It now takes prereqs (HCL emitted ahead of the resource under
  test), fixtures (a shared HCL builder in internal/acctest, so the funding
  source chain is written once), extra_args (Go expressions for a value the
  HCL cannot state literally), and an hcl: value prefix for an expression that
  must go in unquoted.

  The checks got stronger at the same time. The template asserted only that an
  attribute was set, so a resource that accepted input and discarded it passed
  as long as the API echoed anything back, and the update test asserted
  nothing beyond the id, so an update that silently no-opped passed too. Both
  now compare against the value the configuration used, rebuilt through the
  same Sprintf so an assertion cannot drift from its configuration.

  Values were lifted from the hand-written tests rather than invented, so what
  ran against a live install is what the generator emits. 78 of 116 in-scope
  files are generated; the remaining 38 are on archetypes that emit no tests
  yet. A new crud drift gate fails CI when internal/service/ does not match
  freshly generated output, which is what let this rot unnoticed.
