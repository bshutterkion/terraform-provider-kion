kind: BUG FIXES
body: "`kion-import` now ships in the release. It was added as a headline feature in v1.1.0 and documented as a command to run, but goreleaser built only the provider and `kmigrate`, so the only way to get it was a source checkout -- and it cannot be `go install`ed, because `go.mod` declares a bare module path with no domain to install from. It is built for the same platforms as `kmigrate` (linux/darwin/windows on amd64/arm64), being a one-shot tool run against an install rather than something Terraform downloads per platform, and needs no companion file in the release because `codegen/embed.go` compiles `import_manifest.json` into the binary. Its archives are covered by `SHA256SUMS`, so the existing detached signature covers them too. `docs/IMPORTING.md` gained a section on obtaining it, which it never had; it noted the tool only as a command, with no indication of where it came from."
time: 2026-09-15T15:45:00Z
