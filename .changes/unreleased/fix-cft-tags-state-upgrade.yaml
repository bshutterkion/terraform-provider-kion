kind: BUG FIXES
body: "Upgrading a `kion_aws_cloudformation_template` resource from the SDKv2 provider no longer fails when it has `tags` set. The old schema took `tags` as `map(string)`; the new `kion_cft` schema declares it as a list of `{ tag_key, tag_value }` objects, but the generated v0 state upgrader passed the old map through verbatim, so `terraform plan` aborted with `AttributeName(\"tags\"): invalid JSON, expected \"[\", got \"{\"` and the resource could not be migrated at all. The state upgrader now explodes the map into the object list, in sorted key order (which is the order Terraform recorded the map in), and leaves an already-migrated list untouched so re-running is a no-op. The map-to-object-list restructure is now expressed once, as a `kv_list` rule in `codegen/state_upgrades.yaml`, and read by both the state upgrader and `kmigrate`'s config rewriter — previously only the config half knew about it, which is why the state half was missed. New snapshot-driven guards assert that every old-to-new attribute whose JSON shape changed is covered by a rule, and that every block passed through into a nested-object attribute still matches it field for field."
time: 2026-08-21T00:00:00Z
