kind: BUG FIXES
body: "`kion-import rewrite-refs` no longer emits a configuration Terraform refuses to plan. A reference is an edge in Terraform's dependency graph, and some Kion relations are settable from both sides — a user names its groups and a group names its users — so rewriting both directions closed a loop and `terraform validate` failed with `Error: Cycle: kion_user.kion_user_119, kion_user_group.old_kion_developers`. Against a 321-resource install this was not one unlucky record: it produced one 84-node cycle plus six smaller ones. The rewriter previously guarded only self-reference, by string-matching the block's own label, which caught `parent_ou_id` pointing at its own OU and nothing longer. It now builds the dependency graph as it goes and refuses any edge that would close a cycle at any length, leaving that one literal in place. Refusal is per id rather than per attribute, so a list keeps the references that were never part of a loop. The literals kept this way are reported like the existing boundary output but counted separately, because the cause and the remedy differ: the referent is managed here, nothing is missing, and the other side already carries the reference. Edges are offered to the graph in a fixed order — block order in the file, then attribute name, then position in the expression — so the same edge loses on every run and the output does not change between invocations. References the configuration already holds seed the graph, so a second pass cannot add the edge the first pass refused."
time: 2026-08-25T13:00:00Z
