kind: BUG FIXES
body: "`kion_webhook`, `kion_user` and `kion_service_catalog` now delete the record instead of only dropping it from state. The public spec publishes no delete for any of them, so the generator emitted a `Delete` that raised a warning and returned -- every record a configuration created survived `terraform destroy`, left on the install with nothing in state pointing at it. A private delete route exists for each and works; verified on a live install, create then `GET 200` then `DELETE 200` then `GET 404`. The entity archetype now renders a raw-HTTP delete when `codegen/private_endpoints.yaml` declares one and the public spec does not, the same way the blended archetype already did, and the sweeper generator counts a private delete as a delete. Where a sweeper still cannot be registered the stated reason is now the real one -- no enumerable collection -- rather than the delete that does in fact exist."
