kind: BUG FIXES
body: "Five more service packages gained their first acceptance test — `kion_aws_resource_tag`, `kion_compliance_control`, `kion_ou_cloud_access_role_exemption`, `kion_user` and `kion_webhook` — taking acceptance coverage to 54 of 72 packages. `kion_aws_resource_tag` and `kion_user` pass outright; the other three found four defects. `kion_compliance_control` never sends or reads back `program_id`, its only Required attribute, which `Delete` is the sole consumer of, so an imported control cannot be destroyed (#77); the same resource turns an explicitly empty Set into `null` on read, because the API stores `[]` as `null` and the flatten uses `flex.Uint64SliceToFrameworkSet` rather than the `OrEmpty` variant #67 added, so the apply is rejected as an inconsistent result (#78). `kion_webhook` and `kion_user` have a `Delete` that deletes nothing, warning \"no delete endpoint\" — but `DELETE /v1/webhook/{id}` and `DELETE /v1/user/{id}` both exist and work, so every record either type creates survives destroy, and neither has a sweeper to reclaim it (#79). A `kion_ou_cloud_access_role_exemption` that `POST` returns a `record_id` for, and that `DELETE` removes cleanly, is absent from every collection the API exposes, so `Read` drops it from state on every refresh (#80). Those three tests are left red on purpose, each naming its issue in a header comment.\n\nThe test generator gained `RawCollectionPath` (with `RawCollectionParentField` and `RawCollectionDiscriminator`), so a resource with no single-record GET gets Exists and Destroy checks that read the same private collection its own `Read` uses. They were previously `// TODO` stubs that returned `nil`, reporting green whether or not the API had ever seen the record. `metaHasFormatVerbs` now also scans `ExtraHCLBlocks`, which is where a resource whose every attribute is Optional carries its only values — a verb left unscanned reached the config as the literal text `%[1]s`.\n\n`conns.SharedClient` built a client carrying only `Client` and `APIURL`. `rawRequest` reads the credential off the struct rather than through the SDK's security source, so every raw call an acceptance check made answered 401 — which is the only way to check a resource whose read is a private collection."
time: 2026-09-11T23:40:00Z
