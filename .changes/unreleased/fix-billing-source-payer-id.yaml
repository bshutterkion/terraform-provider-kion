kind: BUG FIXES
body: "The four `kion_billing_source*` resources now report the payer id rather than the id of the record nested inside it. `/v1/payer/{id}` answers on the payer id and nests the type-specific record, which carries its own id from a different space -- payer 22 holds `custom_billing_source.id` 5, payer 2 holds `aws_payer.id` 1. Every endpoint addresses the payer: the import block, `DELETE /v3/billing-source/{id}`, `PATCH /v3/billing-source/custom/{id}` (which resolves the payer, then verifies it has a custom record), and `account.payer_id`. Reporting the inner id made every reference to a billing source resolve to the wrong number, and would have pointed `terraform destroy` at whatever billing source happened to hold that id. On one installation this was the last 35 spurious `payer_id` diffs after the collection filter; the imported configuration is now inert."
time: 2026-08-25T22:55:00Z
