kind: BUG FIXES
body: "`make generate-schemas` runs again. It aborted with six \"path not found in OpenAPI spec\" errors and wrote nothing, so no resource's schema could be regenerated at all. Five were private update/delete routes that `generator_config.yaml` names and nothing typed -- tfplugingen resolves every path a resource declares, not just the create and read it builds the schema from -- and are now declared in `spec_additions.yaml` with no body, since they only need to resolve. The sixth was `azure_account.create`, which derivation emitted as the literal query string `/v3/account?account-type=azure`; the spec models those factory-creates as synthetic `/__qs__/` segments, which its `custom` and `google-cloud` siblings already carried. Nothing caught this because the spec is gitignored, so CI cannot run schema generation and `make ci` does not try. Regenerating afterwards reproduces every committed schema byte-for-byte, so the breakage was confined to the generator's ability to run."
time: 2026-09-15T13:05:00Z
