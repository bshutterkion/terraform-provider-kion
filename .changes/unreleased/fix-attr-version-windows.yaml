kind: BUG FIXES
body: >-
  Attribute version gates take a set of ranges rather than a single floor. Kion
  availability is not monotonic and a backport lands at a different patch on
  each line: the cloud access role types are in 3.15.13 and 3.16.5 and absent
  from 3.17.0, so one range spanning both would accept 3.16.0 through 3.16.4,
  where the field does not exist. The API does not reject unknown body fields, so
  it accepts such a field, ignores it, and answers 200; Terraform records
  success and the value never lands.

  The derivation had a second defect that no upper bound alone would have fixed.
  It took the newest tracked version's fields as the set to consider, so a field
  the newest release had dropped never entered the map and got no gate at all.
  It now takes the union across versions and records the first and last release
  carrying each field, bounded by the last release carrying the operation, so a
  dropped attribute stays distinguishable from a dropped endpoint.

  `attrMinKionVersion` becomes `attrKionVersions`, typed
  `map[string]framework.AttrVersions` where each entry is a list of ranges, Min
  inclusive and Before exclusive. The diagnostic names every range it accepts,
  so an instance sitting in a gap between two floors is told both.

  One limit remains. The ranges are derived from the SDK per-minor packages, so
  derivation alone can only express `3.NN.0`; the real patch floors have to be
  authored. Until they are, an attribute introduced at 3.15.13 reads as 3.15.0
  and an instance on 3.15.2 is still told it is fine.
time: 2026-09-16T12:00:00Z
