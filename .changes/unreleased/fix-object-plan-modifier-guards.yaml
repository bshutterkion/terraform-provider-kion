kind: BUG FIXES
body: "Giving every Computed attribute `UseStateForUnknown` broke the plan for three resources outright: `kion_account_cache`, `kion_azure_policy` and `kion_billing_source` failed with `Attribute Missing`. tfplugingen generates `ValueFromObject` without the null/unknown guards its own inverse `ToObjectValue` and its sibling `ValueFromTerraform` both have, and the framework round-trips an object attribute's plan value through it after every object plan modifier. An Optional+Computed object absent from the config is unknown at plan time and has no attributes, so the generated code rejected it. The schema generator now supplies the guards, and `make ci-modules` runs `terraform test` over every module rather than only the staleness diff, which is why nothing local caught this."
time: 2026-08-25T09:40:00Z
