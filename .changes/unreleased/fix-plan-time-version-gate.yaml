kind: BUG FIXES
body: "A Kion instance too old for a resource is now reported during `terraform plan` rather than part-way through `apply`. Gated resources gain a `ModifyPlan` (destroy plans stay allowed, so an unsupported instance cannot strand a resource in state), and the gate now runs in `Read`, `Update` and `Delete` as well as `Create` — as `RequireKionVersionInRange`'s own documentation already described. Gating `Read` matters most: on an instance without the endpoint the API answers 404, which the generated read treats as \"resource gone\" and silently removes from state. `codegen/version_support.yaml` was also stale, leaving `kion_billing_source` (3.14+), `kion_dashboard` (3.15+) and `kion_scope` (3.15+) with no gate at all; regenerating it brings them and several data sources under the same protection."
time: 2026-08-12T09:00:00Z
