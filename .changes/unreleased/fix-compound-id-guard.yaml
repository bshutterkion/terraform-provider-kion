kind: BUG FIXES
body: "`kion_idms_open_id`, `kion_idms_open_id_access_rule` and `kion_idms_open_id_group_association` can be imported again. All three are entity archetypes reached through a parent, so their generated `ImportState` takes a bare id, but the manifest handed them a compound `\"<parent>/<key>\"`. `Read` parsed the whole string as an integer, `terraform plan -generate-config-out` wrote no configuration for them, and `terraform apply` then failed the ENTIRE import with `Configuration for import target does not exist` -- three unimportable records stopped 10,071 others from reaching state. Whether a resource may carry a compound id depends only on whether its `ImportState` splits on `/`, and that fact now lives in one predicate used by both the classifier and the parent overrides rather than in two places that disagreed."
time: 2026-08-26T00:30:00Z
