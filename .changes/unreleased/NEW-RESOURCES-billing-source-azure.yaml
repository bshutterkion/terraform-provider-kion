kind: NEW RESOURCES
body: >-
  kion_billing_source_azure: manage Azure billing sources (CSP, EA, MCA and
  their Government and Secret variants). Kion publishes no public API for them,
  so the resource uses the same private routes as Kion's own UI. The client
  secret is never returned by Kion, so it is not read back, and set
  skip_validation to create or update one without Kion first testing the Azure
  credentials. kion-import imports existing Azure billing sources, and
  rewrite-refs resolves payer_id references to them.
