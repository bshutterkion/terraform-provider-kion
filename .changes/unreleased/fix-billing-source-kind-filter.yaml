kind: BUG FIXES
body: "`kion-import` no longer imports every billing source type as `kion_billing_source`. `GET /v4/billing-source` is the polymorphic collection of every payer type -- aws, azure, gcp, oci, custom, anthropic, openai -- but `kion_billing_source` is specifically the CUSTOM billing source: it creates through `/v3/billing-source/custom` and reads `/v1/payer/{id}`, unwrapping `custom_billing_source`. Enumerating the whole collection handed it records it cannot represent; the by-id read then found no `custom_billing_source` key, flattened every attribute to its zero value, and the resource refreshed as `id = \"0\"`. Every `payer_id` reference pointing at one of those resolved to 0, so an imported configuration planned to unlink accounts from their billing sources -- 6,611 of 12,909 resources on one installation. The collection is now filtered by the same discriminator the cloud-access-role exemptions use, and the dropped records are counted and reported rather than silently omitted."
time: 2026-08-25T21:30:00Z
