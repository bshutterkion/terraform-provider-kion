kind: BUG FIXES
body: "`make version` reported a hardcoded `3.15.1`. It read `info.version` from `spec/swagger-*.json`, which the repo carried until that file was replaced by `openapi3.json`; the glob has matched nothing since, so the fallback — the Kion spec version it happened to be pinned to — became the only value it could produce. That number also named the directory `make install` wrote to, and it described Kion's API rather than the provider. The version now comes from the latest release tag (`0.0.0-dev` when untagged), matching how a release is actually cut. The unused `version-get`/`version-set` targets and their `version/VERSION` file are gone, as is the hand-rolled `make release` cross-compile, which produced bare binaries the Registry would reject; `make release-snapshot` builds the real artifact set locally instead."
time: 2026-08-12T09:00:00Z
