kind: BUG FIXES
body: "Data sources whose SDK list envelope puts the items directly in `Data` (for example `UserListResponse{Data []User}`) are no longer silently downgraded to id-only. List resolution looked the trimmed field type up in the struct index, which for that shape is the literal string `[]User` \u2014 a slice type that can never be a struct \u2014 so resolution aborted, the list model stayed empty, and the id-only template was rendered instead of the list one. The only signal was a line on stderr while `kgen` still exited 0, which is why a large number of data sources shipped without a `filter` block and requiring an `id` their old-provider configurations never had. That shape is now handled by the same helper the items-field path already used."
time: 2026-08-24T00:00:00Z
