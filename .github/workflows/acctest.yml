name: Acceptance tests

# NOT on push or pull_request, and deliberately so: these tests create and
# destroy real records on a live Kion. Running them per-commit would mutate
# somebody's installation on every push, and a fork PR would do it with an
# attacker's configuration. workflow_dispatch means a person chooses the
# moment and the target every time.
#
# This is the only job that exercises Create, Update, Delete and ImportState.
# Everything in ci.yml is compile-, lint- or read-level: acctest-config only
# checks that the test HCL matches the schema, it never applies anything. Until
# this runs, those code paths have never executed against a real API.

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "GitHub Environment holding the credentials (its secrets pick the install)"
        required: true
        type: string
      pattern:
        description: "Run only tests matching this regex (default: all)"
        required: false
        default: "TestAcc"
        type: string
      sweep_first:
        description: "Sweep leftovers from a previous run before starting"
        required: false
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  # One run per environment. Two concurrent runs against one install would
  # race on the shared prerequisites the tests create (permission scheme, OU,
  # project) and on the sweeper, which deletes by name prefix.
  group: acctest-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  acctest:
    name: Acceptance tests (${{ inputs.environment }})
    runs-on: ubuntu-latest
    # The Environment is what gates this: require reviewers on it and a run
    # against a protected install needs approval before any record is written.
    environment: ${{ inputs.environment }}
    timeout-minutes: 150
    env:
      KION_API_URL: ${{ secrets.KION_API_URL }}
      KION_API_KEY: ${{ secrets.KION_API_KEY }}
      # Install-specific ids the tests cannot invent. A test whose variable is
      # unset SKIPS with a message naming it -- it does not fail, and it does
      # not pass either. See the summary step.
      KION_ACC_PAYER_ID: ${{ secrets.KION_ACC_PAYER_ID }}
      KION_ACC_BILLING_SOURCE_ID: ${{ secrets.KION_ACC_BILLING_SOURCE_ID }}
      KION_ACC_AZURE_PAYER_ID: ${{ secrets.KION_ACC_AZURE_PAYER_ID }}
      KION_ACC_AZURE_REGION_ID: ${{ secrets.KION_ACC_AZURE_REGION_ID }}
      KION_ACC_AZURE_SUBSCRIPTION_UUID: ${{ secrets.KION_ACC_AZURE_SUBSCRIPTION_UUID }}
      KION_ACC_AWS_ACCOUNT_NUMBER: ${{ secrets.KION_ACC_AWS_ACCOUNT_NUMBER }}
      KION_ACC_CUSTOM_ACCOUNT_NUMBER: ${{ secrets.KION_ACC_CUSTOM_ACCOUNT_NUMBER }}
      KION_ACC_SAML_IDMS_ID: ${{ secrets.KION_ACC_SAML_IDMS_ID }}
      KION_ACC_APP_ROLE_ID: ${{ secrets.KION_ACC_APP_ROLE_ID }}
      KION_ACC_APP_CONFIG_MUTATION_OK: ${{ secrets.KION_ACC_APP_CONFIG_MUTATION_OK }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Refuse to run without credentials
        run: |
          if [ -z "$KION_API_URL" ] || [ -z "$KION_API_KEY" ]; then
            echo "::error::KION_API_URL and KION_API_KEY must be set on the '${{ inputs.environment }}' environment."
            exit 1
          fi
          echo "target: $KION_API_URL"

      - name: Sweep leftovers from a previous run
        if: ${{ inputs.sweep_first }}
        run: make sweep
        continue-on-error: true

      - name: Acceptance tests
        id: acc
        run: |
          set -o pipefail
          TF_ACC=1 go test -v -count=1 -parallel=4 -timeout 120m \
            -run '${{ inputs.pattern }}' ./internal/service/... 2>&1 | tee acctest.log

      - name: Summarise
        if: always()
        run: |
          {
            echo "## Acceptance tests — ${{ inputs.environment }}"
            echo
            echo "| outcome | count |"
            echo "|---|---:|"
            for r in PASS FAIL SKIP; do
              printf '| %s | %s |\n' "$r" "$(grep -c "^--- $r" acctest.log || echo 0)"
            done
            echo
            # A skip is not a pass. Tests skip when an install-specific id is
            # missing, and a run that is mostly skips has verified almost
            # nothing -- worth seeing in the summary rather than in the log.
            if grep -q 'must be set' acctest.log; then
              echo "### Skipped for missing configuration"
              grep -ho 'KION_ACC_[A-Z_]*' acctest.log | sort -u | sed 's/^/- `/; s/$/`/'
            fi
            if grep -q '^--- FAIL' acctest.log; then
              echo "### Failures"
              grep '^--- FAIL' acctest.log | sed 's/^/- /' | head -40
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # Always, including on cancellation: a cancelled run leaves records
      # behind, and the next run would collide with them by name.
      - name: Sweep
        if: always()
        run: make sweep
        continue-on-error: true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: acctest-log-${{ inputs.environment }}
          path: acctest.log
          retention-days: 14
