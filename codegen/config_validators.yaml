# Cross-field constraints the Kion API enforces and the schema cannot express.
#
# Guarded by: TestConfigValidatorsMatchDeclaration (declaration <-> generated
#             code, both directions) and TestConfigValidatorAttributesExist.
#
# Each entry becomes a resource-level AtLeastOneOf ConfigValidator, so a
# configuration missing all of the listed attributes fails at PLAN time naming
# the Terraform attributes, instead of at apply time with an API validation
# error naming a field the user never wrote.
#
# Authored, not derived. The OpenAPI spec carries almost no constraints -- 3
# enums, 16 patterns and 5 maxLength across 474 schemas -- so none of this comes
# from it; each entry records the request body the API validates, so a reviewer
# can check it against the API's documented behaviour.
#
# Attribute names are the PROVIDER's, resolved per package: they do not always
# match the request body's spelling (see #84), and a validator naming an
# attribute the schema lacks is a runtime panic rather than a compile error.
ami:
  body: AMICreate
  at_least_one_of:
    - owner_user_group_ids
    - owner_user_ids

azure_arm_template:
  body: AzureARMTemplateDefinitionCreate
  at_least_one_of:
    - owner_user_group_ids
    - owner_user_ids

