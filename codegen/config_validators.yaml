# Cross-field constraints the Kion API enforces and the schema cannot express.
#
# Generated by: go test ./internal/kgen/configvalidators/ -update  (needs a
# portal checkout; set KION_PORTAL_DIR)
# Guarded by:   TestConfigValidatorsAreCurrent
#
# Each entry becomes a resource-level AtLeastOneOf ConfigValidator, so a
# configuration missing all of the listed attributes fails at PLAN time with
# a clear message naming them, instead of at apply time with whatever the API
# says -- for kion_user_group that was:
#
#   Bad Request: Key: 'UGroupCreate.OwnerUserIDs' Error:Field validation for
#   'OwnerUserIDs' failed on the 'atLeastOneFieldPresent' tag
#
# Source of truth is the portal's `validate:"atLeastOneFieldPresent=..."`
# struct tags, NOT the OpenAPI spec: the spec carries almost no constraints
# (3 enums, 16 patterns, 5 maxLength across 474 schemas), so none of this is
# derivable from it. `body` records which request struct the constraint came
# from so a reviewer can check it upstream.
#
# Attribute names are the PROVIDER's, resolved per package -- they do not
# always match the API body's spelling (see #84).

