# Compound-key / parent-read archetype declarations.
#
# A resource listed here is generated by the compound renderer instead of the
# entity renderer. Its identity is (parent_id, child_id); it has no single-record
# GET, so its read fetches the parent record (the `read` op in
# generator_config.yaml) and extracts the child from a collection field. Create
# returns the parent, so the new child id is inferred by diffing the parent's
# child-record ids before and after the create.
#
# Fields the generator cannot derive from the op-set + SDK AST alone:
#   parent_id_field  model attribute + parent path param (Required, replace)
#   child_id_field   model attribute for the child id (Computed)
#   child_id_param   SDK params field naming the child id (update/delete)
#   collection       field on the parent read payload holding []child
#   record_id_field  field on the child record equal to child_id
#   json_fields      model attributes carried as jx.Raw <-> jsontypes.Normalized
#
# `kind: entity` entries route to the normal entity renderer and only carry
# tweaks, including the sweeper's:
#   sweep_parent        resource whose collection yields the parent ids
#   sweep_parent_param  the list param those ids are passed as
# A parent-scoped collection takes a required parent id, which the data source
# cannot supply (so it stays id-only) but a sweeper can, by walking the parents
# first. Without these the resource gets NO sweeper, which is deliberate: a
# registered sweeper that swept nothing would report success to `make sweep`.

scope_criteria:
  kind: compound_key_parent_read
  # POST /beta/scope/{id}/criteria REPLACES the scope's single criteria record
  # rather than adding to it, and the delete answers "A scope must retain at
  # least one criteria record". The resource could be created and updated but
  # never destroyed, so Terraform could not manage its lifecycle at all.
  delete_retains: true
  parent_id_field: scope_id
  child_id_field: criteria_id
  child_id_param: CriteriaID
  collection: CriteriaRecords
  record_id_field: ID
  json_fields:
    - criteria

aws_resource_tag:
  kind: no_read

ou_cloud_access_role_exemption:
  kind: no_read

project_cloud_access_role_exemption:
  kind: no_read

# POST /v3/budget takes a single amount and the server expands it into one data
# row per month between start_datecode and end_datecode (exclusive), with the
# amount distributed across them and the remainder landing in the last row. The
# read returns those rows and no amount at all, so summing them is the only way
# amount survives a refresh or an import (#69). Verified on a live 3.16 install:
# amount 1000 over 2026-01..2026-12 comes back as 10 x 90.91 + 90.90 = 1000.00.
budget:
  kind: entity
  sum_from:
    - tf: amount
      from: data
      field: amount

# GET /v3/funding-source/{id} returns neither the owners nor the permission
# scheme, both of which the create body takes and one of which it requires, so
# an imported funding source produced a configuration that could not be applied
# (#68). Both are readable elsewhere -- the owners from the permission mapping's
# owner-role row, the scheme from the private /v2 route behind the UI's
# permissions tab -- which is what funding_source_read.gtpl does.
azure_role:
  kind: entity
  # Kion parses role_permissions into Azure's Permissions struct and re-marshals
  # it, so a body omitting dataActions/notDataActions comes back carrying both as
  # empty arrays. Without this the apply fails outright:
  #   .role_permissions: was {"actions":[...],"notActions":[]}, but now
  #   {"actions":[...],"dataActions":[],"notActions":[],"notDataActions":[]}
  rewritten:
    - role_permissions

funding_source:
  kind: entity
  read_companion: readFundingSourceExtras

compliance_control:
  kind: entity
  # Kion stores an empty id list as null and returns null, so null and empty are
  # one state on the wire. Keeping them distinct made a configured `[]` fail the
  # apply outright: "was cty.SetValEmpty(cty.Number), but now null".
  empty_collections:
    - arm_template_definition_ids
    - aws_cloudformation_policy_ids
    - azure_policy_definition_ids
    - cloud_provider_policy_ids
    - compliance_check_ids
  # DELETE /v4/compliance/program/{id}/control/{controlID}: controlID is the
  # record id; id is the parent program id, sourced from the program_id attribute.
  delete_record_param: ControlID
  delete_extra_param: ID
  delete_extra_field: program_id

# Parent-scoped collections: GET .../{parent}/... needs a parent id, so only a
# sweeper (which enumerates the parents) can list them.
compliance_family:
  kind: entity
  sweep_parent: compliance_program
  sweep_parent_param: ID

compliance_level:
  kind: entity
  sweep_parent: compliance_program
  sweep_parent_param: ID

ou_note:
  kind: entity
  sweep_parent: ou
  sweep_parent_param: ID

idms_group_association:
  kind: entity
  sweep_parent: idms
  sweep_parent_param: ID

saml_group_association:
  kind: entity
  sweep_parent: idms
  sweep_parent_param: ID

global_permission_mapping:
  kind: association
  key_field: app_role_id
  member_fields: [user_ids, user_groups_ids]

funding_source_permission_mapping:
  kind: association
  key_field: app_role_id
  parent_field: funding_source_id
  member_fields: [user_ids, user_groups_ids]

ou_permission_mapping:
  kind: association
  key_field: app_role_id
  parent_field: ou_id
  member_fields: [user_ids, user_groups_ids]

project_permission_mapping:
  kind: association
  key_field: app_role_id
  parent_field: project_id
  member_fields: [user_ids, user_groups_ids]

# Blended because the SDK cannot decode the read response: the spec declares
# delete_finalized_at non-nullable and Kion returns null. See private_endpoints.
account_linkage:
  kind: blended

# Raw create only (#102), same cause as custom_account.
azure_account:
  kind: entity
  raw_create:
    method: POST
    path: /v3/account?account-type=azure

gcp_account:
  kind: entity
  raw_create:
    method: POST
    path: /v3/account?account-type=google-cloud

# Raw create only (#102), same cause as custom_account: the SDK requests
# /v3/account-cache/create/__qs__/account-type/aws, which does not exist.
# organizational_unit is declared rather than derived -- rawModelFields maps
# scalars only and refuses anything else rather than dropping it, which is why
# this resource could not use the raw path until objects were supported.
account_cache:
  kind: entity
  raw_create:
    method: POST
    path: /v3/account-cache/create?account-type=aws
    objects:
      - tf: organizational_unit
        subs: [name, org_unit_id]

# Raw create only (#102). PostCustomAccount requests
# /v3/account/__qs__/account-type/custom -- the spec encodes the account-type
# QUERY parameter as literal path segments around a __qs__ marker that nothing
# converts back, so the URL does not exist and every create 404s. All 13
# account-creation operations in the SDK have this. Read, update and delete use
# /v3/account/{id} and are fine.
custom_account:
  kind: entity
  raw_create:
    method: POST
    path: /v3/account?account-type=custom

# Raw create only. POST /beta/scope answers {status, record_id}; the spec models
# the response as {data: {...}}, so ScopeResponse carries no record_id field at
# all and neither create-id strategy can reach the new id. The resource could not
# be created. Read, update and delete are ordinary. See #103.
scope:
  kind: entity
  raw_create:
    method: POST
    path: /beta/scope

# Raw create only. POST /v3/project-line-item answers 201; the spec declares just
# 200, so ogen refuses to decode a SUCCESSFUL create and the new record's id is
# lost -- the resource could not be created at all. Read, update and delete are
# ordinary and stay on the SDK. See #72 for the declared-vs-actual status family.
project_line_item:
  kind: entity
  raw_create:
    method: POST
    path: /v3/project-line-item

# Blended because the SPEC is empty, not because an endpoint is private: every
# billing-rule verb is public, but the spec's BillingRule read schema has no
# fields, so the typed flatten assigned nothing and an import produced a bare id.
# The read is declared by hand in private_endpoints.yaml.
billing_rule:
  kind: blended

# Blended: typed public create/update via the SDK, private by-id read + delete
# over raw HTTP (no public by-id GET or DELETE for app-role).
app_role:
  kind: blended

# Fully raw: the public /beta create+update take NO typed body in the SDK
# (PostDashboard(ctx)/PatchDashboard(ctx,params)), so there is nothing to blend.
# the raw archetype already POSTs/PATCHes the public /beta paths.
dashboard:
  kind: raw_http

# Blended: typed public create + delete via the SDK, private by-id read + update
# over raw HTTP (the public /v3 read is list-only; update is private /v2).
project_note:
  kind: blended

# Blended with a declared nested read_shape (array-explode): typed public
# create/update/delete; the private /v2/app-policy read returns permission_roles
# as {permission_id, role_ids[]}, exploded into the model's flat roles pairs.
permission_scheme:
  kind: blended

# Blended with a declared nested read_shape (deep object + key rename): typed
# public create/update/delete; the private /v1/payer read nests the record under
# custom_billing_source and tags the role field role_name (model:
# bucket_access_role).
billing_source:
  kind: blended

# Blended, same shape as billing_source: typed public create/update/delete on
# the /oci paths, with the private /v1/payer read nesting the record under
# oci_billing_source. private_key comes back "REDACTED" and is declared
# write_only in private_endpoints.yaml.
billing_source_oci:
  kind: blended

# GovCloud info hangs off a commercial billing source: exactly one per payer,
# with all four verbs on the same parent-scoped path. The create params field is
# the PARENT id, not a literal discriminator, so it is declared create-under-
# parent. Otherwise the resolver reads the trailing static "govcloud" segment
# as a __qs__ discriminator value and emits ID: "govcloud" into a uint64 field.
billing_source_govcloud:
  kind: entity
  create_parent_param: ID
  create_parent_field: payer_id

# AWS billing source: public create + shared delete, no update endpoint at all,
# and no public by-id read. The private /v1/payer read nests under aws_payer.
# key_id/key_secret come back "REDACTED" and are declared write_only.
billing_source_aws:
  kind: blended

# GCP billing source: public create + shared delete, no update endpoint, and no
# public by-id read. The private /v1/payer read nests under gcp_billing_account.
billing_source_gcp:
  kind: blended

# Verbatim resource body (internal/kgen/crud/project.gtpl); schema, data source,
# sweeper and acceptance tests stay derived. Create has to pick between
# POST /v3/project/with-budget and POST /v3/project/with-spend-plan on the
# install's financial mode, because each refuses the other mode before it parses
# the body -- control flow the entity archetype has no way to express (#66).
# POST /v3/project, which the derived body used, is the deprecated spend-plan-only
# alias and is unusable on a budget-mode install.
project:
  kind: entity
  resource_template: project

# Parent-scoped resource with no by-id GET: the read lists enforcements under the
# project and finds by id; every op takes the project id, update/delete also the
# enforcement id. Create returns a CreatedResponse.
project_enforcement:
  kind: parent_list
  parent_id_field: project_id
  parent_param: ID
  child_param: EnforcementID
  record_type: ProjectEnforcement
  response_type: ProjectEnforcementResponse

# Funding-source and OU enforcement have the identical shape at a different
# parent (see project_enforcement). Note the SDK misspells the funding-source
# record type as FundingSourceEnforcmeent.
funding_source_enforcement:
  kind: parent_list
  parent_id_field: funding_source_id
  parent_param: ID
  child_param: EnforcementID
  record_type: FundingSourceEnforcmeent
  response_type: FundingSourceEnforcementResponse

ou_enforcement:
  kind: parent_list
  parent_id_field: ou_id
  parent_param: ID
  child_param: EnforcementID
  record_type: OUEnforcement
  response_type: OUEnforcementListResponse

# idms open-id sub-resources: create is scoped under the parent open-id (its id
# comes from the open_id_id model attribute), while read/update/delete address
# the record by its own id, the entity create-under-parent extension.
idms_open_id_access_rule:
  kind: entity
  create_parent_param: ID
  create_parent_field: open_id_id
idms_open_id_group_association:
  kind: entity
  create_parent_param: ID
  create_parent_field: open_id_id

# Bespoke archetypes: resource + data source bodies emitted verbatim from
# dedicated templates (internal/kgen/crud/*.gtpl) because their CRUD control
# flow fits no derived archetype. Schemas/models still come from the schema and
# version stages.

# PATCH-only settings singleton: no create/delete endpoint, static id, all
# attributes Optional+Computed, read via GetAppConfigKeyIndex.
app_config:
  kind: singleton

# Entity-polymorphic (account/ou/project parent, entity_id + custom_variable_id
# path params) with jx.Raw value polymorphism (value_string/value_list/
# value_map). Data source brute-force enumerates every entity's overrides.
custom_variable_override:
  kind: cv_override

# Cloud-account convert/move state machine (create-new-in-cache, cache<->project
# convert, project->project move) backed by the accounthelper package. account
# and aws_account share the resource template; their data sources differ
# (account = list+filter, aws_account = by-id). Generating `account` also emits
# the shared accounthelper support package.
account:
  kind: cloud_account
aws_account:
  kind: cloud_account

# Data-source-only package (no resource): only a hand-kept data source body is
# emitted; its schema still comes from the schema stage.
gcp_regions:
  kind: datasource_only

# Fully-private note (no public surface), all CRUD over raw HTTP against /v2.
funding_source_note:
  kind: raw_http
