changesDir: .changes
unreleasedDir: unreleased
headerPath: header.tpl.md
changelogPath: CHANGELOG.md
versionExt: md

versionFormat: '## [{{.Version}}] - {{.Time.Format "2006-01-02"}}'
kindFormat: '### {{.Kind}}'
changeFormat: '- {{.Body}}'

# Section names carried over from the hand-written CHANGELOG.
kinds:
  - label: BREAKING CHANGES
  - label: FEATURES
  - label: NEW RESOURCES
  - label: ENHANCEMENTS
  - label: BUG FIXES
  - label: NOTES

newlines:
  afterChangelogHeader: 1
  afterKind: 1
  afterVersion: 1
  beforeKind: 1
  beforeVersion: 1
  endOfVersion: 1
