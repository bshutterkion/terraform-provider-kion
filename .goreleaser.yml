# Terraform Registry release layout: per-platform zips, a _SHA256SUMS file, a
# detached GPG signature of it, and the registry manifest. The Registry rejects
# a release missing any of these.
version: 2

# Explicit: goreleaser otherwise infers this from the directory name, which is
# "new-terraform-provider". The Registry requires terraform-provider-kion_*.
project_name: terraform-provider-kion

builds:
  - id: provider
    env:
      - CGO_ENABLED=0
    mod_timestamp: "{{ .CommitTimestamp }}"
    flags:
      - -trimpath
    ldflags:
      - "-s -w"
    goos:
      - freebsd
      - windows
      - linux
      - darwin
    goarch:
      - amd64
      - "386"
      - arm
      - arm64
    ignore:
      - goos: darwin
        goarch: "386"
    binary: "{{ .ProjectName }}_v{{ .Version }}"

  # kmigrate ships in the release so consumers can migrate a configuration
  # without a source checkout. It cannot be `go install`ed: go.mod declares a
  # bare module path (`module terraform-provider-kion`, no domain), so there is
  # no remote path to install from. Fewer platforms than the provider, since this is
  # a one-shot tool a person runs on a workstation or in CI, not something
  # Terraform downloads per platform.
  - id: kmigrate
    main: ./cmd/kmigrate
    env:
      - CGO_ENABLED=0
    mod_timestamp: "{{ .CommitTimestamp }}"
    flags:
      - -trimpath
    ldflags:
      - "-s -w"
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    binary: kmigrate

archives:
  # The Registry matches provider archives by exact filename, so this template
  # must stay untouched. `ids` is what keeps kmigrate out of it now that there
  # is more than one build.
  - id: provider
    ids: [provider]
    formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

  - id: kmigrate
    ids: [kmigrate]
    formats: [zip]
    name_template: "kmigrate_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

# SHA256SUMS covers every artifact, so signing it (below) transitively covers
# kmigrate and the state-upgrade config too. The Registry ignores lines that do
# not match a provider archive name. It already tolerates the manifest entry
# here, which is the precedent for adding more.
checksum:
  name_template: "{{ .ProjectName }}_{{ .Version }}_SHA256SUMS"
  algorithm: sha256
  extra_files:
    - glob: terraform-registry-manifest.json
      name_template: "{{ .ProjectName }}_{{ .Version }}_manifest.json"
    - glob: codegen/state_upgrades.yaml
      name_template: "state_upgrades_{{ .Version }}.yaml"

signs:
  - artifacts: checksum
    args:
      - "--batch"
      - "--local-user"
      - "{{ .Env.GPG_FINGERPRINT }}"
      - "--output"
      - "${signature}"
      - "--detach-sign"
      - "${artifact}"

release:
  extra_files:
    - glob: terraform-registry-manifest.json
      name_template: "{{ .ProjectName }}_{{ .Version }}_manifest.json"
    # kmigrate needs this to rewrite a configuration; attaching it means a
    # migration needs only the release, not a clone.
    - glob: codegen/state_upgrades.yaml
      name_template: "state_upgrades_{{ .Version }}.yaml"

# Release notes come from the changie version file via --release-notes.
changelog:
  disable: true
